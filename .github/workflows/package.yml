name: Build VSIX Package

env:
  NODE_VERSION: '24'

on:
  workflow_call:
    inputs:
      use_package_version:
        required: false
        type: boolean
        default: false
    outputs:
      vsix_name:
        description: 'Produced VSIX name'
        value: ${{ jobs.Build.outputs.vsix_name }}

jobs:
  Native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache-workspaces: rust

      - name: Install Dependencies
        run: npm ci

      - name: Build Native Addon
        run: npm run rust:build

      - name: Native Smoke Test
        run: npm run rust:smoke

      - name: Upload Native Addon
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/native/${{ matrix.target }}
          overwrite: true

  Build:
    name: Build
    needs: Native
    runs-on: ubuntu-latest
    env:
      ARXML_SKIP_RUST_BUILD: '1'
    outputs:
      vsix_name: ${{ steps.package-output.outputs.vsix_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache-workspaces: rust

      - name: Install Dependencies
        run: npm ci

      - name: Download Native Addons
        uses: actions/download-artifact@v4
        with:
          path: dist/native
          pattern: '*'

      - name: Compile Extension
        run: npm run compile

      - name: Strip Unreleased Changelog
        run: node .github/scripts/strip-unreleased-changelog.mjs

      - name: Determine Suffix
        id: suffix
        run: |
          if [ "${{ inputs.use_package_version }}" = "true" ]; then
            SUFFIX=$(node -p "require('./package.json').version")
          else
            SUFFIX="$GITHUB_SHA"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

      - name: Extract Extension Name
        id: extension-name
        run: |
          NAME=$(node -p "require('./package.json').name")
          echo "extension_name=$NAME" >> $GITHUB_OUTPUT

      - name: Package VSIX
        run: npx @vscode/vsce package --out ${{ steps.extension-name.outputs.extension_name }}-${{ steps.suffix.outputs.suffix }}.vsix

      - name: Verify Every Native Addon In VSIX
        run: |
          set -euo pipefail
          for target in linux-x64 win32-x64 darwin-x64 darwin-arm64; do
            test -f "dist/native/${target}/arxml_node.node"
            unzip -l "${{ steps.extension-name.outputs.extension_name }}-${{ steps.suffix.outputs.suffix }}.vsix" \
              | grep -q "dist/native/${target}/arxml_node.node"
          done

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extension-name.outputs.extension_name }}-${{ steps.suffix.outputs.suffix }}
          path: ${{ steps.extension-name.outputs.extension_name }}-${{ steps.suffix.outputs.suffix }}.vsix

      - name: Set outputs
        id: package-output
        run: |
          echo "vsix_name=${{ steps.extension-name.outputs.extension_name }}-${{ steps.suffix.outputs.suffix }}" >> $GITHUB_OUTPUT
