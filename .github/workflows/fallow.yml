name: Fallow Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Fallow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Fallow Analysis
        uses: fallow-rs/fallow@v3
        with:
          # Pin the CLI: the action selects its own code, not the CLI version. Without
          # this it installs the latest release, and 3.43.0 fails the action's binary
          # verification on this runner ("@fallow-cli/linux-x64-musl not installed").
          version: '3.42.0'
          config: .fallowrc.json
          format: sarif
          # The repository still carries a pre-existing backlog, so keep the
          # analysis advisory until that backlog is cleared.
          fail-on-issues: false
