version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint 8.x peers typescript >=4.8.4 <6.1.0; wait for the lint
    # stack to widen that range before adopting TypeScript 7.
    ignore:
      - dependency-name: "typescript"
        versions: ["7.x", "8.x"]
      # vsce refuses @types/vscode newer than engines.vscode; keep the types at
      # the extension's declared minimum until the minimum itself moves.
      - dependency-name: "@types/vscode"
        versions: [">=1.126"]
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
