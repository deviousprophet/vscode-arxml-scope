# Supply-chain gates for the Rust engine.
#
# Run with:
#   cargo deny --manifest-path rust/Cargo.toml check advisories bans sources licenses

[advisories]
# No advisory is ignored. If one is unavoidable, add an ID with a reason.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally carry no version requirement.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
