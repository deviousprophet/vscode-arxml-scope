[package]
name = "arxml-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "N-API binding for the ARXML Scope Rust core."

[lib]
crate-type = ["cdylib"]

[dependencies]
arxml-core = { path = "../arxml-core" }
napi = { version = "3.16", features = ["napi8"] }
napi-derive = "3.7"

[build-dependencies]
napi-build = "2.6"
